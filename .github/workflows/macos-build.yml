name: Build macOS beta and publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create original character artwork
        run: |
          set -euo pipefail
          mkdir -p Resources
          xcrun swift scripts/generate-art.swift Resources

      - name: Make application icon
        run: |
          set -euo pipefail
          mkdir -p build/Winklet.iconset
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" Resources/WinkletIcon.png \
              --out "build/Winklet.iconset/icon_$sz"x"$sz.png" >/dev/null
            dim=$((sz * 2))
            sips -z "$dim" "$dim" Resources/WinkletIcon.png \
              --out "build/Winklet.iconset/icon_$sz"x"$sz@2x.png" >/dev/null
          done
          iconutil -c icns build/Winklet.iconset -o Resources/Winklet.icns

      - name: Build universal Mac app (Apple Silicon and Intel)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p build/Winklet.app/Contents/MacOS build/Winklet.app/Contents/Resources
          for arch in arm64 x86_64; do
            xcrun swiftc -parse-as-library -swift-version 5 -O \
              -sdk "$SDK" -target "$arch-apple-macos13.0" \
              -framework AppKit -framework SwiftUI -framework Combine \
              -framework CoreImage -framework AVFoundation -framework UserNotifications \
              Winklet.swift -o "build/Winklet-$arch"
          done
          lipo -create build/Winklet-arm64 build/Winklet-x86_64 \
            -output build/Winklet.app/Contents/MacOS/Winklet
          cp Info.plist build/Winklet.app/Contents/Info.plist
          cp Resources/StarFront.png Resources/StarBack.png Resources/MenuIcon.png \
             Resources/WinkletIcon.png Resources/Winklet.icns \
             build/Winklet.app/Contents/Resources/
          codesign --force --sign - build/Winklet.app
          codesign --verify --deep --strict --verbose=2 build/Winklet.app
          lipo -archs build/Winklet.app/Contents/MacOS/Winklet

      - name: Package drag-and-drop DMG
        run: |
          set -euo pipefail
          mkdir -p build/staging
          ditto build/Winklet.app build/staging/Winklet.app
          ln -sfn /Applications build/staging/Applications
          hdiutil create -quiet -volname Winklet \
            -srcfolder build/staging -ov -format UDZO \
            build/Winklet-v1.4.0-beta.1-macOS-universal.dmg
          shasum -a 256 build/*.dmg > build/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winklet-v1.4-beta-macOS
          path: |
            build/Winklet-v1.4.0-beta.1-macOS-universal.dmg
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update beta GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.4.0-beta.1
          name: Winklet v1.4 beta — macOS
          prerelease: true
          draft: false
          body: |
            ✦ Winklet beta for macOS 13+. Apple Silicon and Intel universal app.

            Includes Eye Studio, hue shift, optional always-on-top and click-through,
            Apple Music / Spotify reactions, full Now Playing titles, battery and
            charging reactions, and optional low-battery alerts.

            **Beta notice:** This app is ad-hoc signed, not Apple notarized.
            It has not yet completed testing on real Macs. Gatekeeper may
            require you to allow the app in System Settings.

            Download the DMG and drag Winklet.app to Applications.
            Issues and feedback: https://github.com/y2kbeatzz-dot/Winklet/issues
          files: |
            build/Winklet-v1.4.0-beta.1-macOS-universal.dmg
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
